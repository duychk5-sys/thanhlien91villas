<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Thanhlien91 Villas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; min-height: 100vh; }

#login-screen {
  display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
}
.login-card {
  background: #fff; border-radius: 14px; padding: 36px 32px;
  width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); text-align: center;
}
.login-card h2 { color: #2d6a4f; margin-bottom: 4px; font-size: 1.3rem; }
.login-card p { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
.login-card input {
  width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0;
  border-radius: 9px; font-size: 0.97rem; margin-bottom: 14px;
}
.login-card input:focus { outline: none; border-color: #40916c; }
.btn-primary {
  width: 100%; padding: 12px; background: #2d6a4f; color: #fff;
  border: none; border-radius: 9px; font-size: 0.97rem; font-weight: 700; cursor: pointer;
}
.btn-primary:hover { background: #40916c; }
.login-err { color: #dc2626; font-size: 0.82rem; margin-top: 8px; }

#admin-screen { display: none; }
.topbar {
  background: #2d6a4f; color: #fff; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.topbar h1 { font-size: 1.05rem; }
.topbar-right { display: flex; gap: 10px; align-items: center; }
.btn-sm {
  padding: 7px 14px; border-radius: 7px; font-size: 0.82rem;
  font-weight: 600; cursor: pointer; border: none; transition: 0.15s;
}
.btn-white { background: rgba(255,255,255,0.15); color: #fff; border: 1.5px solid rgba(255,255,255,0.4); }
.btn-white:hover { background: rgba(255,255,255,0.25); }

.content { padding: 20px; max-width: 1200px; margin: 0 auto; }

.stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card {
  background: #fff; border-radius: 12px; padding: 16px 20px; flex: 1; min-width: 130px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.stat-label { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 1.5rem; font-weight: 700; color: #222; margin-top: 4px; }
.stat-value.green { color: #2d6a4f; }
.stat-value.orange { color: #e65100; }

.toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar input, .toolbar select {
  padding: 9px 13px; border: 1.5px solid #e0e0e0; border-radius: 8px;
  font-size: 0.88rem; background: #fff;
}
.toolbar input { flex: 1; min-width: 200px; }
.toolbar input:focus, .toolbar select:focus { outline: none; border-color: #40916c; }

.table-wrap { overflow-x: auto; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
table { width: 100%; border-collapse: collapse; background: #fff; min-width: 900px; }
th {
  background: #f8f9fa; text-align: left; padding: 11px 13px;
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
  color: #666; border-bottom: 1.5px solid #eee; white-space: nowrap;
}
td { padding: 12px 13px; font-size: 0.87rem; border-bottom: 1px solid #f4f4f4; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fffe; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.73rem; font-weight: 700; }
.badge-pending { background: #fff3e0; color: #e65100; }
.badge-paid { background: #e8f5e9; color: #2e7d32; }
.badge-cancelled { background: #fce4ec; color: #c62828; }
.badge-empty { background: #f4f4f4; color: #aaa; }

.action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
.btn-pay { background: #e8f5e9; color: #2e7d32; }
.btn-pay:hover { background: #c8e6c9; }
.btn-cancel { background: #fce4ec; color: #c62828; }
.btn-cancel:hover { background: #f8bbd0; }
.btn-reset { background: #fff3e0; color: #e65100; }
.btn-reset:hover { background: #ffe0b2; }

.ck-code {
  font-family: monospace; font-size: 0.8rem;
  background: #f4f4f4; padding: 2px 7px; border-radius: 4px;
}

.empty-state { text-align: center; padding: 48px; color: #aaa; }
.loading-row td { text-align: center; padding: 40px; color: #aaa; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 14px; padding: 26px 22px;
  width: 100%; max-width: 380px; margin: 20px;
}
.modal h3 { margin-bottom: 8px; }
.modal p { font-size: 0.88rem; color: #555; margin-bottom: 14px; line-height: 1.6; }
.modal textarea {
  width: 100%; padding: 10px 13px; border: 1.5px solid #e0e0e0;
  border-radius: 8px; font-size: 0.88rem; margin-bottom: 14px; resize: vertical;
}
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; padding: 11px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; }
.btn-confirm { background: #2d6a4f; color: #fff; }
.btn-confirm:hover { background: #40916c; }
.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-close-modal { background: #f4f4f4; color: #444; }
.btn-close-modal:hover { background: #e8e8e8; }

.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  color: #fff; padding: 12px 20px; border-radius: 10px;
  font-size: 0.88rem; display: none;
}
.toast.success { background: #2d6a4f; }
.toast.error { background: #dc2626; }

.refresh-note { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h2>🌿 Admin Panel</h2>
    <p>Thanhlien91 Villas — Quản lý đơn hàng</p>
    <input type="password" id="login-token" placeholder="Mật khẩu admin"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">Đăng nhập</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="topbar">
    <div>
      <h1>🌿 Thanhlien91 Villas — Đơn hàng</h1>
      <div class="refresh-note" id="last-refresh">Chưa tải</div>
    </div>
    <div class="topbar-right">
      <button class="btn-sm btn-white" onclick="loadOrders()">🔄 Làm mới</button>
      <button class="btn-sm btn-white" onclick="doLogout()">Đăng xuất</button>
    </div>
  </div>

  <div class="content">
    <div class="stats">
      <div class="stat-card"><div class="stat-label">Tổng đơn</div><div class="stat-value" id="st-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Chờ thanh toán</div><div class="stat-value orange" id="st-pending">—</div></div>
      <div class="stat-card"><div class="stat-label">Đã thanh toán</div><div class="stat-value green" id="st-paid">—</div></div>
      <div class="stat-card"><div class="stat-label">Chưa có mã đơn</div><div class="stat-value" id="st-noid">—</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="s-search" placeholder="🔍 Tên, SĐT, mã đơn..." oninput="renderTable()">
      <select id="s-status" onchange="renderTable()">
        <option value="">Tất cả trạng thái</option>
        <option value="PENDING">Chờ thanh toán</option>
        <option value="DA_THANH_TOAN">Đã thanh toán</option>
        <option value="HUY">Đã hủy</option>
        <option value="">Chưa có trạng thái</option>
      </select>
      <select id="s-pkg" onchange="renderTable()">
        <option value="">Tất cả gói</option>
        <option value="Ngày cuối tuần">Cuối tuần</option>
        <option value="Ngày trong tuần">Trong tuần</option>
        <option value="Yêu cầu tư vấn">Tư vấn</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Thời gian</th>
            <th>Tên khách</th>
            <th>SĐT</th>
            <th>Gói</th>
            <th>Checkin</th>
            <th>Số người</th>
            <th>Ghi chú</th>
            <th>Mã đơn</th>
            <th>Nội dung CK</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="order-tbody">
          <tr class="loading-row"><td colspan="11">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Xác nhận</h3>
    <p id="modal-body"></p>
    <textarea id="modal-note" placeholder="Ghi chú (tuỳ chọn)..." rows="3"></textarea>
    <div class="modal-btns">
      <button class="btn-close-modal" onclick="closeModal()">Hủy bỏ</button>
      <button id="modal-confirm-btn" onclick="confirmAction()">Xác nhận</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminToken = '';
let allOrders = [];
let pendingAction = null;
let autoTimer = null;

const STATUS_LABEL = { PENDING: 'Chờ TT', DA_THANH_TOAN: 'Đã thanh toán', HUY: 'Đã hủy' };

function doLogin() {
  const t = document.getElementById('login-token').value.trim();
  if (!t) return;
  adminToken = t;
  document.getElementById('login-err').textContent = '';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  loadOrders();
  autoTimer = setInterval(loadOrders, 30000); // auto refresh 30s
}

function doLogout() {
  adminToken = '';
  clearInterval(autoTimer);
  allOrders = [];
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-token').value = '';
}

async function loadOrders() {
  try {
    const res = await fetch('/.netlify/functions/get-orders', {
      headers: { 'Authorization': 'Bearer ' + adminToken },
    });
    if (res.status === 401) {
      doLogout();
      document.getElementById('login-err').textContent = 'Sai mật khẩu.';
      return;
    }
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    allOrders = data.orders || [];
    updateStats();
    renderTable();
    document.getElementById('last-refresh').textContent =
      'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN');
  } catch (e) {
    showToast('Lỗi tải dữ liệu: ' + e.message, 'error');
  }
}

function updateStats() {
  const withId = allOrders.filter(o => o.orderId);
  document.getElementById('st-total').textContent = allOrders.length;
  document.getElementById('st-pending').textContent = withId.filter(o => o.status === 'PENDING').length;
  document.getElementById('st-paid').textContent = withId.filter(o => o.status === 'DA_THANH_TOAN').length;
  document.getElementById('st-noid').textContent = allOrders.filter(o => !o.orderId).length;
}

function renderTable() {
  const search = document.getElementById('s-search').value.toLowerCase();
  const fStatus = document.getElementById('s-status').value;
  const fPkg = document.getElementById('s-pkg').value;

  let list = allOrders.filter(o => {
    const ms = !search ||
      (o.name||'').toLowerCase().includes(search) ||
      (o.phone||'').includes(search) ||
      (o.orderId||'').toLowerCase().includes(search);
    const mst = !fStatus || o.status === fStatus;
    const mpkg = !fPkg || (o.packageName||'').includes(fPkg);
    return ms && mst && mpkg;
  });

  const tbody = document.getElementById('order-tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="empty-state">Không có đơn hàng nào</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(o => `
    <tr>
      <td style="white-space:nowrap;font-size:0.8rem;color:#888">${esc(o.thoiGian)}</td>
      <td><strong>${esc(o.name)}</strong></td>
      <td style="white-space:nowrap">${esc(o.phone)}</td>
      <td style="font-size:0.82rem">${esc(o.packageName)}</td>
      <td style="white-space:nowrap;font-size:0.82rem">${esc(o.checkinDate)}</td>
      <td style="text-align:center">${esc(o.soNguoi)}</td>
      <td style="font-size:0.8rem;color:#666;max-width:200px">${esc(o.note)}</td>
      <td>${o.orderId ? `<code style="font-size:0.78rem;color:#555">${esc(o.orderId)}</code>` : '<span style="color:#ddd">—</span>'}</td>
      <td>${o.transferContent ? `<span class="ck-code">${esc(o.transferContent)}</span>` : '<span style="color:#ddd">—</span>'}</td>
      <td>${statusBadge(o.status, o.orderId)}</td>
      <td>
        ${o.orderId ? `
        <div class="action-btns">
          ${o.status !== 'DA_THANH_TOAN' ? `<button class="btn-sm btn-pay" onclick="openModal('${esc(o.orderId)}','DA_THANH_TOAN','pay')">✅ Đã TT</button>` : ''}
          ${o.status !== 'PENDING' && o.status !== '' ? `<button class="btn-sm btn-reset" onclick="openModal('${esc(o.orderId)}','PENDING','reset')">⏳ Chờ TT</button>` : ''}
          ${o.status !== 'HUY' ? `<button class="btn-sm btn-cancel" onclick="openModal('${esc(o.orderId)}','HUY','cancel')">❌ Hủy</button>` : ''}
        </div>` : '<span style="color:#ccc;font-size:0.78rem">Chưa có mã đơn</span>'}
      </td>
    </tr>
  `).join('');
}

function statusBadge(status, orderId) {
  if (!orderId) return '<span class="badge badge-empty">Form cũ</span>';
  if (status === 'DA_THANH_TOAN') return '<span class="badge badge-paid">✅ Đã thanh toán</span>';
  if (status === 'HUY') return '<span class="badge badge-cancelled">❌ Đã hủy</span>';
  if (status === 'PENDING') return '<span class="badge badge-pending">⏳ Chờ TT</span>';
  return '<span class="badge badge-empty">—</span>';
}

function openModal(orderId, status, type) {
  pendingAction = { orderId, status, type };
  const cfg = {
    pay:    { title: '✅ Xác nhận đã thanh toán', body: `Chuyển đơn <strong>${orderId}</strong> sang <strong>Đã thanh toán</strong>?<br><small style="color:#888">Dùng khi khách CK sai nội dung nhưng đã chuyển đúng tiền</small>`, btnClass: 'btn-confirm', btnText: 'Xác nhận đã TT' },
    reset:  { title: '⏳ Chuyển về Chờ thanh toán', body: `Chuyển đơn <strong>${orderId}</strong> về trạng thái <strong>Chờ thanh toán</strong>?`, btnClass: 'btn-confirm', btnText: 'Xác nhận' },
    cancel: { title: '❌ Hủy đơn', body: `Hủy đơn <strong>${orderId}</strong>? Hành động này không thể hoàn tác.`, btnClass: 'btn-danger', btnText: 'Xác nhận hủy' },
  };
  const c = cfg[type] || cfg.pay;
  document.getElementById('modal-title').textContent = c.title;
  document.getElementById('modal-body').innerHTML = c.body;
  document.getElementById('modal-note').value = '';
  const btn = document.getElementById('modal-confirm-btn');
  btn.className = c.btnClass;
  btn.textContent = c.btnText;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  pendingAction = null;
}

async function confirmAction() {
  if (!pendingAction) return;
  const { orderId, status } = pendingAction;
  const note = document.getElementById('modal-note').value.trim();
  closeModal();

  try {
    const res = await fetch('/.netlify/functions/update-order-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
      body: JSON.stringify({ orderId, status, note }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Cập nhật thất bại');

    // Cập nhật local ngay, không cần reload
    const idx = allOrders.findIndex(o => o.orderId === orderId);
    if (idx !== -1) allOrders[idx].status = status;
    updateStats();
    renderTable();
    showToast('✅ Đã cập nhật đơn ' + orderId, 'success');
  } catch (e) {
    showToast('Lỗi: ' + e.message, 'error');
  }
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || '');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3500);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
</script>
</body>
</html>
