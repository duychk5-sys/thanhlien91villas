# netlify.toml

[build]
  publish = "."
  functions = "netlify/functions"

# Không cần redirect vì functions tự nằm ở /.netlify/functions/
# Nhưng thêm security headers

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"

# Environment variables cần set trong Netlify Dashboard → Site Settings → Env Vars:
#
# APPS_SCRIPT_URL      = URL deploy của Google Apps Script Web App
# SHEET_ORDERS_CSV_URL = URL publish CSV của sheet "Orders"
#                        (Google Sheets → File → Share → Publish to web → CSV)
# ADMIN_TOKEN          = Mật khẩu admin panel (đổi thành chuỗi mạnh!)
# BANK_ACCOUNT         = Số tài khoản ngân hàng
# BANK_NAME            = Tên ngân hàng (TPBank, Vietcombank, ...)
# ACCOUNT_NAME         = Tên chủ tài khoản
# SEPAY_SECRET         = (tùy chọn) Secret key từ Sepay để verify webhook
